[project]
name = "drf-project"
version = "0.1.0"
description = ""
authors = [
    {name = "Kirill",email = "kirill.rylskij96@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "django-filter (>=25.2,<26.0)",
    "stripe (>=15.3.0,<16.0.0)"
]

[tool.poetry]
packages = [{include = "drf_project", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "coverage (>=7.14.3,<8.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.12.0,<5.0.0)",
    "celery (>=5.0,<6.0)",
    "redis (>=5.0,<6.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)",
]
